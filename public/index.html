<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Gate Terminal</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F5C518">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css?v=4">
</head>
<body>

<div class="header">
  <div>
    <div class="logo">PARKPRO</div>
    <div class="brand-sub">TULON'S PARKING</div>
    <div class="tag">SMART GATE TERMINAL — HIGH-CONTRAST OUTDOOR MODE</div>
  </div>
</div>

<div class="container">

  <div class="tabs">
    <div class="tab active" id="tabGate" onclick="showTab('gate')">Gate Entry</div>
    <div class="tab" id="tabExpense" onclick="showTab('expense')">Expenses</div>
  </div>

  <div style="text-align:right; margin-bottom:12px;">
    <a href="/admin.html" style="color:#F5C518; font-size:13px;">Desktop CRM Dashboard →</a>
  </div>

  <div class="card">
    <label>Attendant Name</label>
    <input type="text" id="attendantName" placeholder="Your name">
    <button class="secondary" id="confirmNameBtn" style="margin-top:10px;" onclick="confirmName()">Confirm Name</button>
    <div id="nameLockedRow" style="display:none; margin-top:10px; font-size:13px; color:#aaa;">
      Locked as <strong id="lockedNameDisplay"></strong>. <a href="#" onclick="unlockName(); return false;" style="color:#F5C518;">Edit</a>
    </div>
  </div>

  <button class="scan" id="installBtn" style="display:none; background:#3B82F6; color:#fff;" onclick="installApp()">📲 Install App on This Device</button>

  <!-- GATE ENTRY -->
  <div id="gateSection">
    <div class="card">
      <label>Scan or Enter Plate</label>
      <button class="scan" onclick="startScan()">📷 Scan Plate with Camera</button>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
      <div class="status" id="ocrStatus"></div>

      <input type="text" id="plateInput" placeholder="e.g. KA01AB1234" autocapitalize="characters">

      <label>Vehicle Type</label>
      <div class="type-row">
        <div class="type-btn selected" id="btnCar" onclick="selectType('CAR')">🚗 Car</div>
        <div class="type-btn" id="btnBike" onclick="selectType('BIKE')">🏍️ Bike</div>
      </div>
      <div id="chargePreview" class="status" style="margin-top:0;"></div>

      <button class="primary" onclick="checkIn()">✓ Check In Vehicle</button>

      <div id="resultBox"></div>
    </div>

    <div class="card">
      <button class="secondary" style="width:100%; padding:16px; font-size:16px;" onclick="toggleExitPanel()">🚪 Mark Vehicle Exit</button>
      <div id="exitPanel" style="display:none; margin-top:16px;">
        <div class="status" id="exitStatus">Loading parked vehicles...</div>
        <div id="exitList"></div>
      </div>
    </div>
  </div>

  <!-- EXPENSES -->
  <div id="expenseSection" style="display:none">
    <div class="card">
      <label>Amount (₹)</label>
      <input type="number" id="expAmount" placeholder="0">
      <label>Description</label>
      <input type="text" id="expDesc" placeholder="e.g. Fuel, maintenance, snacks">
      <label>Date</label>
      <input type="date" id="expDate">
      <button class="primary" onclick="submitExpense()">Log Expense</button>
      <div id="expenseResult"></div>
    </div>
  </div>

</div>

<div class="footer">© 2026 Tulon's Parking — Built by Chandrajyoti Saikia</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="/gate.js?v=4"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(() => console.log('Service worker registered'));
}
document.getElementById('expDate').valueAsDate = new Date();

const savedName = localStorage.getItem('attendantName');
if (savedName) document.getElementById('attendantName').value = savedName;
document.getElementById('attendantName').addEventListener('input', (e) => {
  if (localStorage.getItem('attendantNameLocked') !== 'true') {
    localStorage.setItem('attendantName', e.target.value.trim());
  }
});
applyNameLockUI();
updateChargePreview();
applyDisplaySettings();

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
async function installApp() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
}
window.addEventListener('appinstalled', () => {
  document.getElementById('installBtn').style.display = 'none';
});

if (window.innerWidth > 900 && !sessionStorage.getItem('skipDesktopRedirect')) {
  window.location.href = '/admin.html';
}
</script>
</body>
</html>
